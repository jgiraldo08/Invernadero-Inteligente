<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1116"/>
      <stop offset="100%" stop-color="#121b22"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="waterMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f0fdf4; }
    .subtitle { font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
    .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
    .label { font-family: 'DM Sans', sans-serif; font-size: 11px; fill: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .state-badge { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Fondo Principal -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad3)" stroke="#23353e" stroke-width="1.5"/>

  <!-- Encabezado -->
  <g transform="translate(35, 32)">
    <rect width="36" height="36" rx="10" fill="#1b4d37" stroke="#335348" stroke-width="1.5"/>
    <path d="M18 10c-4 5-8 9-8 13a8 8 0 0 0 16 0c0-4-4-8-8-13Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="50" y="16" class="title">EVIDENCIA 03: RESPUESTA VISUAL DEL DASHBOARD Y ANIMACIÓN</text>
    <text x="50" y="32" class="subtitle">Comparativa del terrario en modo reposo vs modo de riego activo con microaspersión cenital</text>
  </g>

  <!-- Panel Izquierdo: Estado Normal (En Reposo) -->
  <g transform="translate(35, 88)">
    <rect width="375" height="360" rx="14" fill="#121d23" stroke="#22353c" stroke-width="1.2"/>
    
    <!-- Header panel -->
    <text x="20" y="32" class="card-title">A) Estado Reposo (Monitoreo)</text>
    <rect x="255" y="16" width="100" height="24" rx="12" fill="#1e3a2f" stroke="#335348"/>
    <text x="272" y="32" class="state-badge" fill="#86efac">RIEGO OFF</text>

    <!-- Mini Terrario SVG Reposo -->
    <g transform="translate(20, 55)">
      <rect width="335" height="235" rx="10" fill="#0c1419" stroke="#1d2e38"/>
      <!-- Cúpula de cristal -->
      <path d="M60 90 L120 25 H215 L275 90 V200 H60 Z" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="2" opacity="0.6"/>
      <!-- Maceta y tierra -->
      <path d="M95 180 H240 L225 210 H110 Z" fill="#4a3729" stroke="#6b4f3b" stroke-width="1.5"/>
      <!-- Planta reposo -->
      <path d="M167 180 Q164 140 170 100 Q172 75 167 55" fill="none" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M166 160 Q120 155 100 135 Q130 125 167 150 Z" fill="url(#leafGrad)"/>
      <path d="M168 150 Q215 145 235 125 Q205 115 168 140 Z" fill="url(#leafGrad)"/>
      <path d="M167 125 Q130 115 118 95 Q145 90 167 115 Z" fill="url(#leafGrad)"/>
      <path d="M168 110 Q205 100 220 80 Q195 75 168 100 Z" fill="url(#leafGrad)"/>
      <path d="M167 58 Q160 45 166 35 Q173 45 167 58 Z" fill="#86efac"/>
      <!-- Boquilla inactiva -->
      <rect x="157" y="24" width="20" height="6" rx="2" fill="#334155"/>
    </g>

    <text x="20" y="322" class="label">Bomba Desactivada · GPIO 26 en HIGH (3.3V)</text>
    <text x="20" y="340" style="font-family:'DM Sans'; font-size:12px; fill:#94a3b8;">La plantica realiza un suave balanceo de brisa continuo.</text>
  </g>

  <!-- Panel Derecho: Estado de Riego Activo (Relé ON) -->
  <g transform="translate(440, 88)">
    <rect width="375" height="360" rx="14" fill="#121d23" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Header panel -->
    <text x="20" y="32" class="card-title">B) Estado Activo (Microaspersión)</text>
    <rect x="250" y="16" width="105" height="24" rx="12" fill="#0c4a6e" stroke="#0284c7"/>
    <text x="268" y="32" class="state-badge" fill="#38bdf8">RIEGO ON</text>

    <!-- Mini Terrario SVG Riego -->
    <g transform="translate(20, 55)">
      <rect width="335" height="235" rx="10" fill="#081b24" stroke="#0284c7" stroke-width="1.2"/>
      <!-- Cúpula de cristal -->
      <path d="M60 90 L120 25 H215 L275 90 V200 H60 Z" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="2.2" opacity="0.8"/>
      
      <!-- Cono de rocío / niebla -->
      <path d="M167 30 L110 180 H225 Z" fill="url(#waterMist)"/>
      <!-- Gotas animadas -->
      <g fill="#38bdf8">
        <ellipse cx="167" cy="45" rx="2.5" ry="5"/>
        <ellipse cx="155" cy="65" rx="2" ry="4.5"/>
        <ellipse cx="178" cy="60" rx="2.2" ry="5"/>
        <ellipse cx="148" cy="85" rx="2" ry="4.5"/>
        <ellipse cx="185" cy="90" rx="2.5" ry="5"/>
        <ellipse cx="160" cy="110" rx="2.2" ry="4.5"/>
        <ellipse cx="174" cy="125" rx="2.5" ry="5"/>
        <ellipse cx="152" cy="140" rx="2" ry="4.5"/>
        <ellipse cx="180" cy="155" rx="2.5" ry="5"/>
      </g>
      
      <!-- Ondas en la tierra -->
      <ellipse cx="167" cy="184" rx="35" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
      <ellipse cx="167" cy="184" rx="55" ry="9" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.5"/>

      <!-- Maceta y tierra hidratada -->
      <path d="M95 180 H240 L225 210 H110 Z" fill="#3d2a1d" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Planta hidratándose -->
      <path d="M167 180 Q164 140 170 100 Q172 75 167 55" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
      <path d="M166 160 Q120 155 100 135 Q130 125 167 150 Z" fill="url(#leafGrad)"/>
      <path d="M168 150 Q215 145 235 125 Q205 115 168 140 Z" fill="url(#leafGrad)"/>
      <path d="M167 125 Q130 115 118 95 Q145 90 167 115 Z" fill="url(#leafGrad)"/>
      <path d="M168 110 Q205 100 220 80 Q195 75 168 100 Z" fill="url(#leafGrad)"/>
      <path d="M167 58 Q160 45 166 35 Q173 45 167 58 Z" fill="#bbf7d0"/>
      <!-- Boquilla activa con resplandor -->
      <rect x="157" y="24" width="20" height="6" rx="2" fill="#38bdf8"/>
      <circle cx="167" cy="27" r="5" fill="#e0f2fe"/>
    </g>

    <text x="20" y="322" class="label" style="fill:#38bdf8;">Bomba Energizada · GPIO 26 en LOW (0V)</text>
    <text x="20" y="340" style="font-family:'DM Sans'; font-size:12px; fill:#94a3b8;">Activación de partículas, gotas descendentes y brillo de agua.</text>
  </g>
</svg>
