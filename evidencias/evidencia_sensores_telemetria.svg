<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1116"/>
      <stop offset="100%" stop-color="#121b22"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18252d"/>
      <stop offset="100%" stop-color="#121d24"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f0fdf4; }
    .subtitle { font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
    .badge-ok { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; fill: #4ade80; }
    .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
    .metric-val { font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 700; fill: #ffffff; }
    .metric-unit { font-size: 18px; fill: #94a3b8; font-weight: 500; }
    .label { font-family: 'DM Sans', sans-serif; font-size: 11px; fill: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #86efac; }
  </style>

  <!-- Fondo Principal -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)" stroke="#23353e" stroke-width="1.5"/>

  <!-- Encabezado de la Tarjeta de Evidencia -->
  <g transform="translate(35, 32)">
    <rect width="36" height="36" rx="10" fill="#1b4d37" stroke="#335348" stroke-width="1.5"/>
    <path d="M18 10v16M10 18h16" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="16" class="title">EVIDENCIA 01: PRUEBA DE SENSORES Y TELEMETRÍA</text>
    <text x="50" y="32" class="subtitle">Validación experimental de rangos ADC, calibración FC-28 y protocolo 1-Wire DHT22</text>
    <rect x="635" y="4" width="145" height="26" rx="13" fill="#1e3a2f" stroke="#335348"/>
    <circle cx="648" cy="17" r="4.5" fill="#4ade80"/>
    <text x="659" y="21" class="badge-ok">TEST SUPERADO</text>
  </g>

  <!-- Tarjeta 1: Sensor de Humedad de Suelo FC-28 -->
  <g transform="translate(35, 95)">
    <rect width="375" height="240" rx="14" fill="url(#cardGrad)" stroke="#22353c" stroke-width="1.2"/>
    <text x="24" y="34" class="card-title">Sensor de Humedad en Sustrato (FC-28)</text>
    <text x="24" y="52" class="label">Pin GPIO 34 · ADC1 12-bit · 8 Muestras Promediadas</text>

    <!-- Valor principal -->
    <text x="24" y="104" class="metric-val">58<tspan class="metric-unit">% HR</tspan></text>
    
    <!-- Barra de progreso calibrada -->
    <rect x="24" y="122" width="327" height="8" rx="4" fill="#1f323c"/>
    <rect x="24" y="122" width="190" height="8" rx="4" fill="url(#greenBar)"/>

    <!-- Puntos de Calibración -->
    <g transform="translate(24, 150)">
      <rect width="156" height="66" rx="8" fill="#0d1519" stroke="#1e2c34"/>
      <text x="12" y="20" class="label">Lectura Seco (Aire)</text>
      <text x="12" y="38" class="mono">ADC: 3500 pts</text>
      <text x="12" y="54" style="font-family:'DM Sans'; font-size:10px; fill:#94a3b8;">Calibrado: 0% humedad</text>

      <rect x="171" width="156" height="66" rx="8" fill="#0d1519" stroke="#1e2c34"/>
      <text x="183" y="20" class="label">Lectura Saturada (Agua)</text>
      <text x="183" y="38" class="mono">ADC: 1200 pts</text>
      <text x="183" y="54" style="font-family:'DM Sans'; font-size:10px; fill:#94a3b8;">Calibrado: 100% humedad</text>
    </g>
  </g>

  <!-- Tarjeta 2: Sensor de Temperatura y Humedad DHT22 -->
  <g transform="translate(440, 95)">
    <rect width="375" height="240" rx="14" fill="url(#cardGrad)" stroke="#22353c" stroke-width="1.2"/>
    <text x="24" y="34" class="card-title">Sensor Termohigrométrico DHT22 (AM2302)</text>
    <text x="24" y="52" class="label">Pin GPIO 21 · Protocolo Digital 1-Wire con Pull-up</text>

    <!-- Columnas gemelas: Temp y Aire -->
    <g transform="translate(24, 75)">
      <text x="0" y="28" class="label">Temperatura Ambiente</text>
      <text x="0" y="68" class="metric-val" style="fill:#fef08a;">24.5<tspan class="metric-unit" style="fill:#facc15;">°C</tspan></text>
      <rect x="0" y="82" width="150" height="6" rx="3" fill="#1f323c"/>
      <rect x="0" y="82" width="73" height="6" rx="3" fill="url(#goldBar)"/>
      <text x="0" y="104" style="font-family:'DM Sans'; font-size:10px; fill:#94a3b8;">Rango normal: 18°C a 30°C</text>
    </g>

    <g transform="translate(200, 75)">
      <text x="0" y="28" class="label">Humedad Relativa Aire</text>
      <text x="0" y="68" class="metric-val" style="fill:#e0f2fe;">68.2<tspan class="metric-unit" style="fill:#38bdf8;">%</tspan></text>
      <rect x="0" y="82" width="150" height="6" rx="3" fill="#1f323c"/>
      <rect x="0" y="82" width="102" height="6" rx="3" fill="url(#cyanBar)"/>
      <text x="0" y="104" style="font-family:'DM Sans'; font-size:10px; fill:#94a3b8;">Nivel óptimo para follaje</text>
    </g>

    <rect x="24" y="196" width="327" height="26" rx="6" fill="#0d1519" stroke="#1e2c34"/>
    <text x="36" y="213" class="mono" style="fill:#38bdf8;">Checksum OK · Time-out: 0 ms · dht_ok: true</text>
  </g>

  <!-- Barra Inferior: Parámetros del Ensayo -->
  <g transform="translate(35, 355)">
    <rect width="780" height="95" rx="12" fill="#0d1419" stroke="#1e2d36" stroke-width="1.2"/>
    
    <g transform="translate(25, 22)">
      <text x="0" y="14" class="label">PERIODO DE MUESTREO</text>
      <text x="0" y="34" style="font-family:'Space Grotesk'; font-size:15px; font-weight:700; fill:#f1f5f9;">2500 ms (0.4 Hz)</text>
      <text x="0" y="52" style="font-family:'DM Sans'; font-size:11px; fill:#64748b;">Cumple especificación DHT22</text>
    </g>

    <line x1="220" y1="20" x2="220" y2="75" stroke="#22353c" stroke-width="1"/>

    <g transform="translate(245, 22)">
      <text x="0" y="14" class="label">CALIDAD DE ENLACE WI-FI</text>
      <text x="0" y="34" style="font-family:'Space Grotesk'; font-size:15px; font-weight:700; fill:#4ade80;">-58 dBm (Excelente)</text>
      <text x="0" y="52" style="font-family:'DM Sans'; font-size:11px; fill:#64748b;">SSID: C.U.A · 802.11 b/g/n</text>
    </g>

    <line x1="470" y1="20" x2="470" y2="75" stroke="#22353c" stroke-width="1"/>

    <g transform="translate(495, 22)">
      <text x="0" y="14" class="label">PAQUETES TRANSMITIDOS</text>
      <text x="0" y="34" style="font-family:'Space Grotesk'; font-size:15px; font-weight:700; fill:#38bdf8;">1,420 sin pérdidas (0%)</text>
      <text x="0" y="52" style="font-family:'DM Sans'; font-size:11px; fill:#64748b;">QoS 0 · HiveMQ Cloud WSS</text>
    </g>
  </g>
</svg>
