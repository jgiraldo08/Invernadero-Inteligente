<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1116"/>
      <stop offset="100%" stop-color="#121b22"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18252d"/>
      <stop offset="100%" stop-color="#121d24"/>
    </linearGradient>
    <linearGradient id="waterFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f0fdf4; }
    .subtitle { font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
    .badge-ok { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; fill: #4ade80; }
    .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
    .label { font-family: 'DM Sans', sans-serif; font-size: 11px; fill: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #94a3b8; }
  </style>

  <!-- Fondo Principal -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad2)" stroke="#23353e" stroke-width="1.5"/>

  <!-- Encabezado de la Tarjeta de Evidencia -->
  <g transform="translate(35, 32)">
    <rect width="36" height="36" rx="10" fill="#1b4d37" stroke="#335348" stroke-width="1.5"/>
    <path d="M12 18l4 4 8-8" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="16" class="title">EVIDENCIA 02: ENSAYO DE RELÉ Y CORTE DE SEGURIDAD</text>
    <text x="50" y="32" class="subtitle">Verificación de activación por relé optoacoplado y corte forzado por software a los 8.0 s</text>
    <rect x="635" y="4" width="145" height="26" rx="13" fill="#1e3a2f" stroke="#335348"/>
    <circle cx="648" cy="17" r="4.5" fill="#4ade80"/>
    <text x="659" y="21" class="badge-ok">CORTE EXACTO 8s</text>
  </g>

  <!-- Diagrama de Tiempos / Oscilograma Digital -->
  <g transform="translate(35, 95)">
    <rect width="780" height="235" rx="14" fill="url(#cardGrad2)" stroke="#22353c" stroke-width="1.2"/>
    <text x="24" y="30" class="card-title">Cronograma de Conmutación de Señales (GPIO 26 &amp; Bomba)</text>
    <text x="24" y="48" class="label">Comportamiento Active-LOW (0V = Conducción / 3.3V = Aislado)</text>

    <!-- Eje temporal -->
    <g transform="translate(130, 80)">
      <!-- Cuadrícula de fondo -->
      <line x1="0" y1="0" x2="600" y2="0" stroke="#1f2d36" stroke-width="1"/>
      <line x1="0" y1="50" x2="600" y2="50" stroke="#1f2d36" stroke-width="1"/>
      <line x1="0" y1="100" x2="600" y2="100" stroke="#1f2d36" stroke-width="1"/>

      <!-- Líneas verticales de tiempo -->
      <line x1="0" y1="-10" x2="0" y2="110" stroke="#22353e" stroke-dasharray="3,3"/>
      <line x1="90" y1="-10" x2="90" y2="110" stroke="#38bdf8" stroke-dasharray="3,3" opacity="0.6"/>
      <line x1="490" y1="-10" x2="490" y2="110" stroke="#f87171" stroke-dasharray="3,3" opacity="0.8"/>
      <line x1="600" y1="-10" x2="600" y2="110" stroke="#22353e" stroke-dasharray="3,3"/>

      <!-- Trazado Señal GPIO 26 (Active LOW) -->
      <!-- Comienza en 3.3V (HIGH=0y), baja a 0V (LOW=40y) a los 90px (t=0s), dura 400px (8s) y sube a 3.3V -->
      <path d="M 0 5 H 90 V 38 H 490 V 5 H 600" fill="none" stroke="#4ade80" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Trazado Estado de la Bomba (Agua) -->
      <!-- Comienza en OFF (100y), sube a ON (65y) durante el pulso y cae a OFF -->
      <path d="M 0 100 H 90 V 65 H 490 V 100 H 600" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 90 65 H 490 V 100 H 90 Z" fill="url(#waterFlow)" opacity="0.12"/>

      <!-- Marcadores de tiempo en el eje X -->
      <text x="0" y="125" class="mono" text-anchor="middle">t = -1.5s</text>
      <text x="90" y="125" class="mono" text-anchor="middle" style="fill:#38bdf8; font-weight:700;">t = 0.0s (ON)</text>
      <text x="290" y="125" class="mono" text-anchor="middle" style="fill:#94a3b8;">Ventana Activa: 8,000 ms</text>
      <text x="490" y="125" class="mono" text-anchor="middle" style="fill:#f87171; font-weight:700;">t = +8.0s (OFF)</text>
      <text x="590" y="125" class="mono" text-anchor="middle">t = +10.0s</text>
    </g>

    <!-- Etiquetas de los canales a la izquierda -->
    <g transform="translate(24, 75)">
      <text x="0" y="12" style="font-family:'Space Grotesk'; font-size:12px; font-weight:700; fill:#4ade80;">CH1: GPIO 26</text>
      <text x="0" y="26" class="mono">3.3V (HIGH) / 0V (LOW)</text>

      <text x="0" y="75" style="font-family:'Space Grotesk'; font-size:12px; font-weight:700; fill:#38bdf8;">CH2: BOMBA 12V</text>
      <text x="0" y="89" class="mono">Activación Hidráulica</text>
    </g>
  </g>

  <!-- Tarjetas Inferiores: Parámetros y Medición de Seguridad -->
  <g transform="translate(35, 345)">
    <!-- Medición 1 -->
    <rect width="245" height="105" rx="12" fill="#0d1419" stroke="#1e2d36" stroke-width="1.2"/>
    <text x="20" y="32" class="label">TIEMPO MEDIDO DE PULSO</text>
    <text x="20" y="64" style="font-family:'Space Grotesk'; font-size:26px; font-weight:700; fill:#4ade80;">8,004 ms</text>
    <text x="20" y="86" style="font-family:'DM Sans'; font-size:11px; fill:#94a3b8;">Delta programado: 8,000 ms (±4 ms)</text>

    <!-- Medición 2 -->
    <g transform="translate(265, 0)">
      <rect width="250" height="105" rx="12" fill="#0d1419" stroke="#1e2d36" stroke-width="1.2"/>
      <text x="20" y="32" class="label">PROTECCIÓN CONTRA DESCONEXIÓN</text>
      <text x="20" y="64" style="font-family:'Space Grotesk'; font-size:22px; font-weight:700; fill:#38bdf8;">FAIL-SAFE ACTIVO</text>
      <text x="20" y="86" style="font-family:'DM Sans'; font-size:11px; fill:#94a3b8;">Si Wi-Fi/MQTT cae, corta de inmediato</text>
    </g>

    <!-- Medición 3 -->
    <g transform="translate(535, 0)">
      <rect width="245" height="105" rx="12" fill="#0d1419" stroke="#1e2d36" stroke-width="1.2"/>
      <text x="20" y="32" class="label">ESTADO DE AISLAMIENTO</text>
      <text x="20" y="64" style="font-family:'Space Grotesk'; font-size:26px; font-weight:700; fill:#fde047;">OPTOACOPLADO</text>
      <text x="20" y="86" style="font-family:'DM Sans'; font-size:11px; fill:#94a3b8;">Sin retorno inductivo al ESP32</text>
    </g>
  </g>
</svg>
